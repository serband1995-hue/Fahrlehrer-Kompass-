name: Prüfung vor dem Live-Gang

# Läuft bei jedem Pull Request und nach dem Merge auf main. Schnelle Tests ohne Browser und
# (seit 21.11.2026) ein Browser-Job für Rollen und Zugänge – alles ohne Netz-Zugriff auf Datenbanken und ohne Geheimnisse.
# Ändert nichts am Live-Gang (GitHub Pages aus dem Branch main).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefung:
    name: Schnelle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-check.sh vergleicht mit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release-Check (Versionen, Geheimnisse, Hinweis auf fremde E-Mails)
        run: bash scripts/release-check.sh
      - name: Rechen-Test
        run: node scripts/rechnen-test.mjs
      - name: "Termin-Export v4 (bestanden je Nummer und Klasse, Geschwister weg)"
        run: node --experimental-strip-types scripts/termine-export-test.mjs
      - name: "W15 S3: einstellbare Fristen (ohne Einstellung wie vorher, gesetzliche Fristen fest)"
        run: node scripts/fristen-test.mjs
      - name: "W15 S4: Nachrichten-Vorlagen (eine Datei für Büro und Server, Mail maskiert, Betreff fest)"
        run: node scripts/vorlagen-test.mjs
      - name: Cache-Test (nur eigene Caches löschen)
        run: node scripts/cache-test.mjs
      - name: Zugang-Regeln (bearbeiten/löschen, Rechte)
        run: node scripts/zugang-regeln-test.mjs
      - name: Startseite je Rolle (Weiterleitung ohne Schleife)
        run: node scripts/startseite-test.mjs
      - name: "Datenbank in echtem Postgres (PGlite): W15 Reaktivierungs-Sperre, W11 Papierkorb-Frist je Fahrschule"
        run: |
          npm i --silent --no-save --prefix /tmp/w15-pg @electric-sql/pglite@0.2.17
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/reakt-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/vorlagen-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/erinnerung-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/papierkorb-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/belege-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/w19-probe-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/punkte-sql-test.mjs
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/w19-3-probe-sql-test.mjs

  # 🗣 Serband 21.11.2026: „sorge dafür, dass solche Fehler nicht nochmal vorkommen“ (Jelena: Leitung, die selbst fährt,
  # fand keinen Weg, Schüler anzulegen). Jede Rolle wird vom Start bis zum gespeicherten Schüler durchgespielt.
  rollen:
    name: Rollen und Zugänge (Browser)
    runs-on: ubuntu-latest
    # Seit 25.11.2026 25 statt 15 Minuten: die Schritte zusammen brauchen lokal gut 15 Minuten, der Job wurde mitten im
    # letzten Test abgebrochen (W11 und W16), obwohl alles grün war. Gleiche Grenze wie der Büro-Job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: "Rollen-Test (jede Rolle: Startansicht, Schüler anlegen, gespeichert)"
        run: NODE_PATH=$(npm root -g) node scripts/rollen-test.mjs
      - name: "Verkauf ohne Provision (Büro, keine Provision ans Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/verkauf-test.mjs
      - name: "Zugang-Test (Fahrlehrer bearbeiten und löschen, Rechte je Rolle)"
        run: NODE_PATH=$(npm root -g) node scripts/zugang-test.mjs
      - name: "Ausbildungsnachweis (Büro: Übersicht, Ändern mit Spur, Papierkorb, Druck)"
        run: NODE_PATH=$(npm root -g) node scripts/nachweis-test.mjs
      - name: "Neuigkeiten (Zeitstrahl, Hinweis nach Update ohne Knopf)"
        run: NODE_PATH=$(npm root -g) node scripts/neuigkeiten-test.mjs
      - name: Wetter ohne Schlüssel (K1, Dienste nachgestellt)
        run: NODE_PATH=$(npm root -g) node scripts/wetter-k1-test.mjs
      - name: "Ruhiges Klappen (K2+K4, App und Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/klapp-test.mjs
      - name: "Buchungs-QR fürs Auto (K3)"
        run: NODE_PATH=$(npm root -g) node scripts/buchqr-test.mjs
      - name: "Prüfer-Wissen gemeinsam (K5: Notizen mit Verfasser, keine fremden Schülernamen)"
        run: NODE_PATH=$(npm root -g) node scripts/pruefer-gemeinsam-test.mjs
      - name: "Schüler-Überblick und Weitergeben (K6: Akte gesperrt, kein Bestätigen-Fenster)"
        run: NODE_PATH=$(npm root -g) node scripts/schueler-ueberblick-test.mjs
      - name: "Fahrcheck-Menü zeigt die echte Zahl (W17)"
        run: NODE_PATH=$(npm root -g) node scripts/fc-menue-test.mjs
      - name: "Lohn folgt Fahrcheck-Abgabe (W19)"
        run: NODE_PATH=$(npm root -g) node scripts/lohn-fc-test.mjs
      - name: "Zahlungsbelege im Büro (W19)"
        run: NODE_PATH=$(npm root -g) node scripts/belege-test.mjs
      - name: "Punktesystem mit Platzhaltern: Büro und App (W19)"
        run: NODE_PATH=$(npm root -g) node scripts/punkte-test.mjs
      - name: "Schülerliste geordnet: feste Gruppen, Sortierung gemerkt (W17)"
        run: NODE_PATH=$(npm root -g) node scripts/schuelerliste-test.mjs
      - name: "Kalender: Termine erst nach 0,8 s Halten ziehen (W17)"
        run: NODE_PATH=$(npm root -g) node scripts/kalender-halten-test.mjs
      - name: "Wartet auf Theorie: grüner Knopf (K14)"
        run: NODE_PATH=$(npm root -g) node scripts/theorie-wartet-test.mjs
      - name: "Zurück auf jeder Seite (K10, App und Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/zurueck-test.mjs
      - name: "Zahlung ausstehend (K8, App und Büro: Knöpfe, Sperre für neue Termine, alte Datenbank)"
        run: NODE_PATH=$(npm root -g) node scripts/zahlung-test.mjs
      - name: "Büro: Seitenleiste (8 Punkte) und Doppelbelegung gesehen (K18)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-gruppen-test.mjs
      - name: "Löschen, Stornieren, Papierkorb (K7)"
        run: NODE_PATH=$(npm root -g) node scripts/loeschen-test.mjs
      - name: "Preisliste im Büro (K9: gültig ab, Verlauf, Herunterladen)"
        run: NODE_PATH=$(npm root -g) node scripts/preisliste-test.mjs
      - name: "W15 Reaktivierung entfällt laut Preisliste = keine Sperre (Büro und App)"
        run: NODE_PATH=$(npm root -g) node scripts/reakt-entfaellt-test.mjs
      - name: "W15 Fristen: Reiter „Läuft bald ab“ (alle Fristen nach Datum, Schüler und Fahrlehrer)"
        run: NODE_PATH=$(npm root -g) node scripts/laeuft-ab-test.mjs
      - name: Paket-Baukasten im Büro (Werkstatt 13)
        run: NODE_PATH=$(npm root -g) node scripts/baukasten-test.mjs
      - name: Paket verkaufen und „noch offen“ (Werkstatt 13)
        run: |
          node scripts/paket-stand-test.mjs
          NODE_PATH=$(npm root -g) node scripts/paket-verkauf-test.mjs
      - name: Sonderfahrt-Kästchen im Plan (90 Minuten = 2, Werkstatt 13)
        run: |
          NODE_PATH=$(npm root -g) node scripts/sonder-kaestchen-test.mjs
          SONDER_SCHNELL=1 NODE_PATH=$(npm root -g) node scripts/sonder-stopp-test.mjs
      - name: "Zahlungsaufforderung per Mail (Mail-Inhalt, GiroCode)"
        run: |
          npm i --silent --no-save --prefix /tmp/zm-qr jsqr@1.4.0 pngjs@7.0.0
          ZM_QR_DIR=/tmp/zm-qr node scripts/zahlungsmail-mail-test.mjs
      - name: "Zahlungsaufforderung per Mail im Büro (Knopf, Haken, Rückgängig)"
        run: NODE_PATH=$(npm root -g) node scripts/zahlungsmail-test.mjs
      - name: Zahlungsaufforderung direkt nach dem Eintragen einer Prüfung (W15c)
        run: NODE_PATH=$(npm root -g) node scripts/zm-pruefung-test.mjs
      - name: "W15 S5: Erinnerung schicken ohne Zahlung (Theorie, Antrag, Behörde, Umschreiber) im Büro"
        run: NODE_PATH=$(npm root -g) node scripts/erinnerung-test.mjs
      - name: "W14 Akte überschreibt keine neueren Änderungen (Büro-Akte, Fristen)"
        run: NODE_PATH=$(npm root -g) node scripts/akte-konflikt-test.mjs
      - name: "Abgleich App ↔ Büro (Datenverlust-Fälle, W14 Name/Telefon, Gesamtansicht)"
        run: NODE_PATH=$(npm root -g) node scripts/abgleich-test.mjs

  fahrlehrer-team:
    # W18 (🗣 Serband 26.11.2026: „Mach den Test mit allen Funktionen für fünf bis zehn Fahrlehrer, damit es wirklich bei jedem klappt“).
    # 10 Fahrlehrer, Leitung fährt selbst, Büro, Super-Admin: Anmeldung, Nutzungsbedingungen, Alltag, Trennung, Wechsel auf demselben Handy.
    # Eigener Job, weil er allein knapp 3 Minuten braucht und der Rollen-Job schon an seiner Grenze ist.
    name: Zehn Fahrlehrer (Browser + Datenbank-Probe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: "Zehn Fahrlehrer: Anlegen bis Alltag, Trennung, gleiches Handy, Büro/Leitung sehen alle (W18)"
        run: NODE_PATH=$(npm root -g) node scripts/fahrlehrer-team-test.mjs
      - name: "W18 Live-Probe als Trockenlauf in PGlite (Rücknahme, Trennung, Migration Rolle im WITH CHECK)"
        run: |
          npm i --silent --no-save --prefix /tmp/w18-pg @electric-sql/pglite@0.2.17
          NODE_PATH=/tmp/w18-pg/node_modules node scripts/w18-probe-sql-test.mjs
      - name: "W20 anon-Rechte + Büro an mehreren PCs: Migrationen, Rückwege, Live-Probe als Trockenlauf in PGlite"
        run: |
          NODE_PATH=/tmp/w18-pg/node_modules node scripts/w20-sql-test.mjs
          # live ist Postgres 17 (Recht MAINTAIN): derselbe Test zusätzlich mit PGlite auf PG 17
          npm i --silent --no-save --prefix /tmp/w20-pg17 @electric-sql/pglite@0.3.14
          NODE_PATH=/tmp/w20-pg17/node_modules node scripts/w20-sql-test.mjs
      - name: "W21 Prüfungstage (55-Min-Fenster): Migration, Doppelbelegung, Spiegel, Rückweg, Live-Probe als Trockenlauf in PGlite (PG 16 und 17)"
        run: |
          NODE_PATH=/tmp/w18-pg/node_modules node scripts/w21-sql-test.mjs
          NODE_PATH=/tmp/w20-pg17/node_modules node scripts/w21-sql-test.mjs

  buero:
    # Eigener Job (läuft parallel), weil der Büro-Test allein etwa 8 Minuten braucht.
    # Seit 24.11.2026: lief vorher nicht auf GitHub – ein Fehler, der nur abends auftrat (Termin schon vorbei), blieb unbemerkt.
    name: Büro-Seite (Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # lokal 8 Minuten, auf GitHub meist langsamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: "Büro-Test (alle Bereiche, Rollen, Kalender, Schüler, Fristen, Handy-Größen)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-test.mjs
      - name: "Büro-Auswertung (Durchfallgründe, Verschiebungen)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-auswertung-test.mjs
      - name: "Einstellungen-Baustein KE (Laden, Speichern, Grenzen)"
        run: node scripts/ke-test.mjs
      - name: "Büro: Einstellungen nach Themen (Entwürfe, Zurück, Handy)"
        run: NODE_PATH=$(npm root -g) node scripts/einstellungen-test.mjs
      - name: "W15: Thema „Fristen“ (Speichern, Rückgängig, echter Rahmen, App übernimmt die Werte)"
        run: NODE_PATH=$(npm root -g) node scripts/fristen-thema-test.mjs
      - name: "W15: Thema „Nachrichten-Vorlagen“ (Vorschau, Speichern, Rückgängig, Handy)"
        run: NODE_PATH=$(npm root -g) node scripts/vorlagen-thema-test.mjs
      - name: "Büro: Urlaub, Schichtplan und Backups auf der Büro-Seite (W16 Teil 2, Urlaubs-Warnung im Termin-Fenster)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-verwaltung-test.mjs
      - name: "Rückgängig-Zeit aus den Einstellungen (App: Hinweis und Absage-Mail gekoppelt)"
        run: NODE_PATH=$(npm root -g) node scripts/rueckgaengig-zeit-test.mjs
