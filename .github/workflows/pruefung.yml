name: Prüfung vor dem Live-Gang

# Läuft bei jedem Pull Request und nach dem Merge auf main. Schnelle Tests ohne Browser und
# (seit 21.11.2026) ein Browser-Job für Rollen und Zugänge – alles ohne Netz-Zugriff auf Datenbanken und ohne Geheimnisse.
# Ändert nichts am Live-Gang (GitHub Pages aus dem Branch main).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefung:
    name: Schnelle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-check.sh vergleicht mit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release-Check (Versionen, Geheimnisse, Hinweis auf fremde E-Mails)
        run: bash scripts/release-check.sh
      - name: Rechen-Test
        run: node scripts/rechnen-test.mjs
      - name: Cache-Test (nur eigene Caches löschen)
        run: node scripts/cache-test.mjs
      - name: Zugang-Regeln (bearbeiten/löschen, Rechte)
        run: node scripts/zugang-regeln-test.mjs
      - name: "W15 Reaktivierung: Sperre der Datenbank in echtem Postgres (PGlite), gleich wie Büro und App"
        run: |
          npm i --silent --no-save --prefix /tmp/w15-pg @electric-sql/pglite@0.2.17
          NODE_PATH=/tmp/w15-pg/node_modules node scripts/reakt-sql-test.mjs

  # 🗣 Serband 21.11.2026: „sorge dafür, dass solche Fehler nicht nochmal vorkommen“ (Jelena: Leitung, die selbst fährt,
  # fand keinen Weg, Schüler anzulegen). Jede Rolle wird vom Start bis zum gespeicherten Schüler durchgespielt.
  rollen:
    name: Rollen und Zugänge (Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: "Rollen-Test (jede Rolle: Startansicht, Schüler anlegen, gespeichert)"
        run: NODE_PATH=$(npm root -g) node scripts/rollen-test.mjs
      - name: "Verkauf ohne Provision (Büro, keine Provision ans Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/verkauf-test.mjs
      - name: "Zugang-Test (Fahrlehrer bearbeiten und löschen, Rechte je Rolle)"
        run: NODE_PATH=$(npm root -g) node scripts/zugang-test.mjs
      - name: "Ausbildungsnachweis (Büro: Übersicht, Ändern mit Spur, Papierkorb, Druck)"
        run: NODE_PATH=$(npm root -g) node scripts/nachweis-test.mjs
      - name: "Neuigkeiten (Zeitstrahl, Hinweis nach Update ohne Knopf)"
        run: NODE_PATH=$(npm root -g) node scripts/neuigkeiten-test.mjs
      - name: Wetter ohne Schlüssel (K1, Dienste nachgestellt)
        run: NODE_PATH=$(npm root -g) node scripts/wetter-k1-test.mjs
      - name: "Ruhiges Klappen (K2+K4, App und Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/klapp-test.mjs
      - name: "Buchungs-QR fürs Auto (K3)"
        run: NODE_PATH=$(npm root -g) node scripts/buchqr-test.mjs
      - name: "Prüfer-Wissen gemeinsam (K5: Notizen mit Verfasser, keine fremden Schülernamen)"
        run: NODE_PATH=$(npm root -g) node scripts/pruefer-gemeinsam-test.mjs
      - name: "Schüler-Überblick und Weitergeben (K6: Akte gesperrt, kein Bestätigen-Fenster)"
        run: NODE_PATH=$(npm root -g) node scripts/schueler-ueberblick-test.mjs
      - name: "Wartet auf Theorie: grüner Knopf (K14)"
        run: NODE_PATH=$(npm root -g) node scripts/theorie-wartet-test.mjs
      - name: "Zurück auf jeder Seite (K10, App und Büro)"
        run: NODE_PATH=$(npm root -g) node scripts/zurueck-test.mjs
      - name: "Zahlung ausstehend (K8, App und Büro: Knöpfe, Sperre für neue Termine, alte Datenbank)"
        run: NODE_PATH=$(npm root -g) node scripts/zahlung-test.mjs
      - name: "Büro: Seitenleiste (8 Punkte) und Doppelbelegung gesehen (K18)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-gruppen-test.mjs
      - name: "Einstellungen-Baustein KE (Laden, Speichern, Grenzen)"
        run: node scripts/ke-test.mjs
      - name: "Büro: Einstellungen nach Themen (Entwürfe, Zurück, Handy)"
        run: NODE_PATH=$(npm root -g) node scripts/einstellungen-test.mjs
      - name: "Löschen, Stornieren, Papierkorb (K7)"
        run: NODE_PATH=$(npm root -g) node scripts/loeschen-test.mjs
      - name: "Preisliste im Büro (K9: gültig ab, Verlauf, Herunterladen)"
        run: NODE_PATH=$(npm root -g) node scripts/preisliste-test.mjs
      - name: "W15 Reaktivierung entfällt laut Preisliste = keine Sperre (Büro und App)"
        run: NODE_PATH=$(npm root -g) node scripts/reakt-entfaellt-test.mjs
      - name: "W15 Fristen: Reiter „Läuft bald ab“ (alle Fristen nach Datum, Schüler und Fahrlehrer)"
        run: NODE_PATH=$(npm root -g) node scripts/laeuft-ab-test.mjs
      - name: Paket-Baukasten im Büro (Werkstatt 13)
        run: NODE_PATH=$(npm root -g) node scripts/baukasten-test.mjs
      - name: Paket verkaufen und „noch offen“ (Werkstatt 13)
        run: |
          node scripts/paket-stand-test.mjs
          NODE_PATH=$(npm root -g) node scripts/paket-verkauf-test.mjs
      - name: "Zahlungsaufforderung per Mail (Mail-Inhalt, GiroCode)"
        run: |
          npm i --silent --no-save --prefix /tmp/zm-qr jsqr@1.4.0 pngjs@7.0.0
          ZM_QR_DIR=/tmp/zm-qr node scripts/zahlungsmail-mail-test.mjs
      - name: "Zahlungsaufforderung per Mail im Büro (Knopf, Haken, Rückgängig)"
        run: NODE_PATH=$(npm root -g) node scripts/zahlungsmail-test.mjs
      - name: "W14 Akte überschreibt keine neueren Änderungen (Büro-Akte, Fristen)"
        run: NODE_PATH=$(npm root -g) node scripts/akte-konflikt-test.mjs
      - name: "Abgleich App ↔ Büro (Datenverlust-Fälle, W14 Name/Telefon, Gesamtansicht)"
        run: NODE_PATH=$(npm root -g) node scripts/abgleich-test.mjs

  buero:
    # Eigener Job (läuft parallel), weil der Büro-Test allein etwa 8 Minuten braucht.
    # Seit 24.11.2026: lief vorher nicht auf GitHub – ein Fehler, der nur abends auftrat (Termin schon vorbei), blieb unbemerkt.
    name: Büro-Seite (Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25   # lokal 8 Minuten, auf GitHub meist langsamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright mit Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: "Büro-Test (alle Bereiche, Rollen, Kalender, Schüler, Fristen, Handy-Größen)"
        run: NODE_PATH=$(npm root -g) node scripts/buero-test.mjs
