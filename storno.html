<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termin stornieren</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c1410;color:#eaf1ec;margin:0;padding:24px 18px;line-height:1.5;}
  .card{max-width:480px;margin:40px auto;background:#132420;border-radius:16px;padding:24px;border:1px solid rgba(150,200,165,.18);text-align:center;}
  h1{font-size:19px;margin:0 0 12px;}
  p{font-size:14.5px;color:#c9d6cf;}
  .btn{padding:14px 24px;border-radius:12px;background:#c4744f;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;}
  .ok{color:#7bc47f;}
  .warn{color:#e0a97a;}
</style></head><body>
<div class="card" id="card"><p>Wird geprüft …</p></div>
<script>
const API = "https://oectrvkjunntzsggyhxv.supabase.co/functions/v1/public-booking";
const token = new URLSearchParams(window.location.search).get("token");
const card = document.getElementById("card");

function fmt(datum, von){
  const d = new Date(datum+"T00:00:00");
  return d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"}) + " · " + von + " Uhr";
}
// Inhalt der Karte sicher (ohne innerHTML für Serverdaten) aufbauen
function zeige(titel, klasse, absaetze, knopf){
  card.textContent = "";
  const h = document.createElement("h1"); h.textContent = titel; if(klasse) h.className = klasse; card.appendChild(h);
  (absaetze||[]).forEach(t => { const p = document.createElement("p"); p.textContent = t; card.appendChild(p); });
  if(knopf){ const b = document.createElement("button"); b.className = "btn"; b.textContent = knopf.text; b.addEventListener("click", knopf.klick); card.appendChild(b); }
}
function fehler(){ zeige("Fehler", "", ["Etwas ist schiefgelaufen. Bitte melde dich direkt bei deinem Fahrlehrer."]); }
function ergebnis(data){
  if(data.error === "not_found"){ zeige("Nicht gefunden", "", ["Diesen Termin konnten wir nicht finden."]); return; }
  if(data.status === "already_cancelled"){ zeige("Bereits storniert", "", ["Dieser Termin ("+fmt(data.datum,data.von)+") wurde bereits storniert."]); return; }
  if(data.status === "too_late"){ zeige("Zu kurzfristig", "warn", ["Dein Termin am "+fmt(data.datum,data.von)+" ist weniger als 24 Stunden entfernt.", "Eine Online-Stornierung ist jetzt nicht mehr möglich. Bitte melde dich direkt bei deinem Fahrlehrer."]); return; }
  if(data.status === "cancelled"){ zeige("Storniert ✓", "ok", ["Dein Termin am "+fmt(data.datum,data.von)+" wurde storniert.", "Der Platz ist jetzt wieder frei für andere."]); return; }
  if(data.status === "cancellable"){
    // Erst auf Knopfdruck stornieren: Link-Vorschauen und E-Mail-Scanner öffnen Links sonst unbemerkt.
    zeige("Termin stornieren?", "", ["Dein Termin: "+fmt(data.datum,data.von)+".", "Möchtest du diesen Termin wirklich absagen?"], { text: "Ja, Termin stornieren", klick: stornieren });
    return;
  }
  fehler();
}
async function stornieren(){
  const b = card.querySelector("button"); if(b){ b.disabled = true; b.textContent = "Wird storniert …"; }
  try{
    const res = await fetch(API+"?action=cancel&token="+encodeURIComponent(token), { method: "POST" });
    ergebnis(await res.json());
  }catch(e){ zeige("Netzwerkfehler", "", ["Bitte nochmal versuchen oder direkt beim Fahrlehrer melden."]); }
}
async function run(){
  if(!token){ zeige("Ungültiger Link", "", ["Dieser Storno-Link ist nicht vollständig."]); return; }
  card.textContent = "Termin wird geprüft …";
  try{
    const res = await fetch(API+"?action=cancel&token="+encodeURIComponent(token));
    ergebnis(await res.json());
  }catch(e){ zeige("Netzwerkfehler", "", ["Bitte nochmal versuchen oder direkt beim Fahrlehrer melden."]); }
}
run();
</script>
</body></html>
