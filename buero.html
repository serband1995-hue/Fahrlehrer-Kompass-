<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kompass Büro</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="buero.css">
<script>
  // Vorführung (buero.html?vorfuehrung): erfundene Daten statt Datenbank, nichts wird gespeichert
  window.BUERO_VORFUEHRUNG = /[?&]vorfuehrung\b/.test(location.search);
  document.write(window.BUERO_VORFUEHRUNG
    ? '<script src="buero-vorfuehrung.js"><\/script>'
    : '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
</script>
<script src="kompass-rechnen.js"></script>
<script src="buero.js" defer></script>
</head>
<body>

<!-- Anmeldung -->
<div id="login" class="login" hidden>
  <form class="login-karte" id="loginForm" autocomplete="on">
    <img src="icon-192.png" alt="" class="login-logo">
    <h1>Kompass Büro</h1>
    <p class="leise">Für Büro und Fahrschul-Leitung. Gleiche Zugangsdaten wie in der Kompass-App.</p>
    <label>E-Mail
      <input type="email" id="loginMail" autocomplete="username" required>
    </label>
    <label>Passwort
      <input type="password" id="loginPw" autocomplete="current-password" required>
    </label>
    <p class="fehler" id="loginFehler" role="alert"></p>
    <button type="submit" class="knopf haupt gross" id="loginKnopf">Anmelden</button>
    <a class="leise klein" href="index.html">Passwort vergessen? In der Kompass-App zurücksetzen</a>
  </form>
</div>

<!-- Hinweis statt App (gesperrt, falsche Rolle, Nutzungsbedingungen) -->
<div id="hinweis" class="login" hidden>
  <div class="login-karte">
    <img src="icon-192.png" alt="" class="login-logo">
    <h1 id="hinweisTitel"></h1>
    <p id="hinweisText"></p>
    <div class="knopfreihe" id="hinweisKnoepfe"></div>
  </div>
</div>

<!-- Büro-Oberfläche -->
<div id="app" class="app" hidden>
  <aside class="seite">
    <div class="marke">
      <img src="icon-192.png" alt="">
      <div>
        <div class="marke-name">Kompass Büro</div>
        <div class="marke-schule" id="schulName"></div>
      </div>
    </div>
    <label class="schulwahl" id="schulWahlWrap" hidden>Fahrschule
      <select id="schulWahl"></select>
    </label>
    <nav id="nav" aria-label="Bereiche"></nav>
    <div class="seite-fuss">
      <div class="nutzer">
        <div class="nutzer-name" id="nutzerName"></div>
        <div class="nutzer-rolle" id="nutzerRolle"></div>
      </div>
      <button class="knopf klein" id="abmelden" type="button">Abmelden</button>
    </div>
  </aside>
  <main class="inhalt">
    <header class="kopf">
      <h1 id="titel"></h1>
      <div class="kopf-rechts">
        <span class="vorfuehrung" id="vorfuehrung" hidden>Vorführung · erfundene Daten · nichts wird gespeichert</span>
        <span class="status" id="status"><span class="punkt"></span><span id="statusText">verbinde …</span></span>
        <button class="knopf klein" id="neuLaden" type="button" title="Daten neu laden">↻ Aktualisieren</button>
      </div>
    </header>
    <section id="ansicht" class="ansicht" tabindex="-1"></section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
