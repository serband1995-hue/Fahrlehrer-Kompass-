<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lernzielkontrolle – Musterlösungen</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
<style>
  body { font-size: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 2em; font-weight: 900; margin: 0 0 .2em; }
  .unter { color: var(--muted); margin: 0 0 1em; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; position: sticky; top: 0; padding: 10px 0; background: var(--bg); z-index: 2; }
  nav a { text-decoration: none; color: var(--txt); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .35em .75em; font-weight: 700; }
  nav a:hover { border-color: var(--gold); }
  nav .platz { flex: 1; }
  section { margin-bottom: 28px; scroll-margin-top: 70px; }
  h2 { font-size: 1.45em; margin: 0 0 .1em; }
  h2 span { color: var(--gold); }
  .ut { color: var(--muted); margin-bottom: .8em; }
  .direkt { font-size: .9em; } .direkt a { color: var(--gold); word-break: break-all; }
  .q { padding: 14px 16px; margin-bottom: 10px; break-inside: avoid; }
  .q .f { font-weight: 800; margin-bottom: .5em; line-height: 1.3; }
  .q ol { margin: 0 0 .5em; padding-left: 0; list-style: none; display: grid; gap: 4px; }
  .q li { padding: .3em .6em; border-radius: 8px; background: var(--surface-2); }
  .q li.ok { background: var(--ok-soft); color: #bff0cf; font-weight: 700; }
  .q li.ok::before { content: "✓ "; }
  .q li b { color: var(--muted); margin-right: .4em; }
  .q .e { color: #d4e2db; line-height: 1.45; font-size: .95em; }
  .q .e small { color: var(--faint); }
  @media print {
    :root { --bg: #fff; --txt: #111; --muted: #555; --surface: #fff; --surface-2: #f3f3f3; --line: #ccc; --faint: #777; }
    body { background: #fff; color: #111; font-size: 11pt; }
    nav, .druck { display: none; }
    .karte { box-shadow: none; border: 1px solid #ccc; background: #fff; }
    .q li.ok { background: #e3f5e8; color: #0f5a2a; }
    .q .e { color: #333; }
    section { page-break-before: always; }
    section:first-of-type { page-break-before: auto; }
    h2 span { color: #8a6a12; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lernzielkontrolle – Musterlösungen</h1>
  <p class="unter">Alle Fragen des Live-Quiz mit richtiger Antwort und Erklärung. Nur für den Fahrlehrer.</p>
  <nav id="nav"></nav>
  <div id="inhalt"></div>
</div>
<script src="quiz-fragen.js"></script>
<script>
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const L = window.QUIZ_LEKTIONEN || [];
  document.getElementById("nav").innerHTML = L.map((l) => `<a href="#l${l.lektion}">${l.lektion}</a>`).join("")
    + '<span class="platz"></span><a href="#" class="druck" onclick="window.print();return false">🖨 Drucken</a>';
  document.getElementById("inhalt").innerHTML = L.map((l) => `
    <section id="l${l.lektion}">
      <h2><span>Lektion ${l.lektion}</span> · ${esc(l.titel)}</h2>
      <div class="ut">${esc(l.untertitel || "")} · <span class="direkt">Direktlink für die PowerPoint: <a href="quiz-tafel.html?l=${l.lektion}" target="_blank">${esc(new URL("quiz-tafel.html?l=" + l.lektion, location.href).href)}</a></span></div>
      ${l.fragen.map((f, i) => `
        <div class="karte q">
          <div class="f">${i + 1}. ${esc(f.frage)}</div>
          <ol>${f.antworten.map((a, j) => `<li class="${j === f.richtig ? "ok" : ""}"><b>${"ABCD"[j]}</b>${esc(a)}</li>`).join("")}</ol>
          <div class="e">${esc(f.erklaerung || "")}${f.folie ? ` <small>(Folie ${f.folie})</small>` : ""}</div>
        </div>`).join("")}
    </section>`).join("");
  const nr = new URLSearchParams(location.search).get("l");
  if (nr) { const el = document.getElementById("l" + nr); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
